[project]
name = "job-hunter"
version = "0.1.0"
description = "Job hunting agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.40",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "selectolax>=0.3",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "aiosqlite>=0.19",
    "google-genai>=1.0",
    "python-telegram-bot>=20.7",
    "rich>=13.0",
    "click>=8.1",
    "apscheduler>=3.10",
    "pyyaml>=6.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
